<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cash Analytics</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;--card:#fff;--bdr:#e2e8f0;--surf:#f8fafc;--surf2:#f1f5f9;
  --t1:#0f172a;--t2:#334155;--t3:#64748b;--t4:#94a3b8;--t5:#cbd5e1;
  --g:#16a34a;--gb:#dcfce7;--gd:#15803d;
  --r:#dc2626;--rb:#fee2e2;--rd:#b91c1c;
  --a:#f59e0b;--ab:#fef3c7;--ad:#b45309;
  --b:#3b82f6;--bb:#eff6ff;--bd:#1d4ed8;
  --font:'Inter',-apple-system,sans-serif;
}
html,body{
  width:100%;height:100%;background:var(--bg);
  font-family:var(--font);
  display:flex;align-items:flex-start;justify-content:center;
  overflow:auto;-webkit-font-smoothing:antialiased;
}
#app{width:calc(100% - 16px);max-width:960px;padding:8px 0 14px;}

.shell{
  background:var(--card);border-radius:16px;
  border:0.5px solid var(--bdr);overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.07);
  animation:rise .28s cubic-bezier(.22,.68,0,1.1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;border-bottom:0.5px solid var(--surf2);flex-wrap:wrap;gap:8px;
}
.topbar-left{display:flex;align-items:center;gap:8px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 0 2px var(--gb);}
.title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);}
.tgl-group{display:flex;gap:2px;background:var(--surf2);border-radius:7px;padding:2px;}
.tgl{
  font-size:9.5px;font-weight:600;padding:3px 10px;border-radius:5px;
  border:none;cursor:pointer;background:transparent;color:var(--t4);
  font-family:var(--font);transition:all .15s;
}
.tgl:hover{color:var(--t2);}
.tgl.on{background:var(--card);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08);}

/* KPI STRIP */
.kpi-strip{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  border-bottom:0.5px solid var(--surf2);
}
.kpi{
  padding:11px 13px;border-right:0.5px solid var(--surf2);
  border-left:3px solid transparent;transition:border-color .25s;
}
.kpi:last-child{border-right:none;}
.kpi.c-g{border-left-color:var(--g);}
.kpi.c-r{border-left-color:var(--r);}
.kpi.c-a{border-left-color:var(--a);}
.kpi.c-b{border-left-color:var(--b);}
.kpi-l{font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);margin-bottom:4px;}
.kpi-v{font-size:16px;font-weight:600;color:var(--t1);letter-spacing:-0.02em;line-height:1;margin-bottom:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi-d{font-size:8px;font-weight:500;}
.kpi-d.g{color:var(--gd);}.kpi-d.r{color:var(--rd);}.kpi-d.a{color:var(--ad);}.kpi-d.b{color:var(--bd);}.kpi-d.n{color:var(--t4);}

/* CHART */
.chart-wrap{padding:14px 16px 0;position:relative;}
#chart{width:100%;display:block;}
.axis-strip{display:flex;justify-content:space-between;padding:3px 16px 8px;font-size:8.5px;color:var(--t5);}

/* INSIGHT ROW */
.insight-row{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  border-top:0.5px solid var(--surf2);
}
.ins{padding:9px 12px;border-right:0.5px solid var(--surf2);}
.ins:last-child{border-right:none;}
.ins-l{font-size:8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t4);margin-bottom:3px;}
.ins-v{font-size:12px;font-weight:600;color:var(--t1);margin-bottom:1px;font-variant-numeric:tabular-nums;}
.ins-d{font-size:8.5px;color:var(--t4);}

/* LEGEND */
.legend{
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
  padding:8px 16px 10px;border-top:0.5px solid var(--surf2);
}
.leg{display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--t3);}
.leg-ln{width:16px;height:2px;border-radius:2px;}
.leg-bar{width:8px;height:8px;border-radius:2px;}

/* RESPONSIVE */
#app[data-size="xs"] .kpi-strip{grid-template-columns:repeat(3,1fr);}
#app[data-size="xs"] .insight-row{grid-template-columns:1fr 1fr;}
#app[data-size="xs"] .ins:nth-child(2){border-right:none;}
#app[data-size="xs"] .ins:nth-child(3),
#app[data-size="xs"] .ins:nth-child(4){border-top:0.5px solid var(--surf2);}
</style>
</head>
<body>
<div id="app">
<div class="shell">

  <div class="topbar">
    <div class="topbar-left">
      <div class="live-dot"></div>
      <span class="title">Cash Position Analytics</span>
    </div>
    <div class="tgl-group">
      <button class="tgl" data-w="90">3M</button>
      <button class="tgl" data-w="180">6M</button>
      <button class="tgl" data-w="365">1Y</button>
      <button class="tgl on" data-w="0">All</button>
    </div>
  </div>

  <div class="kpi-strip">
    <div class="kpi c-g" id="kpi0"><div class="kpi-l">Ending Balance</div><div class="kpi-v" id="k-end">—</div><div class="kpi-d b" id="k-end-d">Latest</div></div>
    <div class="kpi c-b" id="kpi1"><div class="kpi-l">Beginning Bal.</div><div class="kpi-v" id="k-beg">—</div><div class="kpi-d b" id="k-beg-d">Period start</div></div>
    <div class="kpi c-a" id="kpi2"><div class="kpi-l">Ordered Cash</div><div class="kpi-v" id="k-ord">—</div><div class="kpi-d n" id="k-ord-d">Net total</div></div>
    <div class="kpi" id="kpi3"><div class="kpi-l">Limit</div><div class="kpi-v" id="k-lim">—</div><div class="kpi-d a" id="k-lim-d">Cap</div></div>
    <div class="kpi" id="kpi4"><div class="kpi-l">Utilisation</div><div class="kpi-v" id="k-util">—</div><div class="kpi-d n" id="k-util-d">vs limit</div></div>
  </div>

  <div class="chart-wrap">
    <canvas id="chart" height="190"></canvas>
  </div>
  <div class="axis-strip"><span id="ax-l"></span><span id="ax-r"></span></div>

  <div class="insight-row">
    <div class="ins"><div class="ins-l">▲ Max Ending Balance</div><div class="ins-v" id="i-max-v">—</div><div class="ins-d" id="i-max-d">—</div></div>
    <div class="ins"><div class="ins-l">▼ Min Ending Balance</div><div class="ins-v" id="i-min-v">—</div><div class="ins-d" id="i-min-d">—</div></div>
    <div class="ins"><div class="ins-l">⊘ Limit Breached</div><div class="ins-v" id="i-breach-v">—</div><div class="ins-d" id="i-breach-d">—</div></div>
    <div class="ins"><div class="ins-l">↕ Avg Ending Balance</div><div class="ins-v" id="i-avg-v">—</div><div class="ins-d" id="i-avg-d">—</div></div>
  </div>

  <div class="legend">
    <div class="leg"><div class="leg-ln" style="background:#16a34a"></div>Ending Balance</div>
    <div class="leg"><div class="leg-ln" style="background:#3b82f6;border-top:2px dashed #3b82f6;height:0"></div>Beginning Balance</div>
    <div class="leg"><div class="leg-bar" style="background:rgba(245,158,11,.25);border:1px solid #f59e0b"></div>Ordered Cash</div>
    <div class="leg"><div class="leg-ln" style="background:#cbd5e1;border-top:2px dashed #cbd5e1;height:0"></div>Limit</div>
  </div>

</div>
</div>

<script>
'use strict';
(function(){

  var $=function(id){return document.getElementById(id);};
  var appEl=$('app');
  var chartObj=null;
  var ALL=[];
  var activeW=0;

  /* ── Format numbers ── */
  function fN(n){
    if(n===null||isNaN(n)) return '—';
    var abs=Math.abs(n),s=n<0?'-':'';
    if(abs>=1e9) return s+(abs/1e9).toFixed(2)+'B';
    if(abs>=1e6) return s+(abs/1e6).toFixed(2)+'M';
    if(abs>=1e3) return s+Math.round(abs).toLocaleString('en-US');
    return s+abs.toFixed(0);
  }

  function fmtDate(d){
    if(!d) return '—';
    var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();
  }
  function shortDate(d){
    if(!d) return '';
    var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return M[d.getMonth()]+' \''+String(d.getFullYear()).slice(2);
  }

  /* ── Responsive ── */
  function applyScale(w){
    var fs=Math.min(14,Math.max(9,Math.round((w/960)*13)));
    appEl.style.fontSize=fs+'px';
    appEl.setAttribute('data-size',w<480?'xs':w<640?'sm':'lg');
    if(chartObj) chartObj.resize();
  }
  if(window.ResizeObserver){
    new ResizeObserver(function(e){applyScale(e[0].contentRect.width);}).observe(appEl);
  }
  window.addEventListener('resize',function(){applyScale(appEl.offsetWidth||960);});

  /* ── CONFIRMED WORKING data reader ── */
  async function getData(ws){
    var rows=[],rdr=await ws.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
    for(var i=0;i<rdr.pageCount;i++){
      var pg=await rdr.getPageAsync(i);
      pg.data.forEach(function(r){
        var row={};
        pg.columns.forEach(function(c,idx){row[c.fieldName]=r[idx];});
        rows.push(row);
      });
    }
    await rdr.releaseAsync();
    return rows;
  }

  async function getEnc(ws){
    var spec=await ws.getVisualSpecificationAsync(),map={};
    if(spec.activeMarksSpecificationIndex<0) return map;
    spec.marksSpecifications[spec.activeMarksSpecificationIndex]
        .encodings.forEach(function(e){map[e.id]=e.field;});
    return map;
  }

  /* ── num from DataValue ── */
  function dvNum(dv){
    if(!dv) return null;
    var n=parseFloat(dv.nativeValue!==undefined?dv.nativeValue:dv.value);
    return isNaN(n)?null:n;
  }

  /* ── Find row key matching an encoding field (exact, then case-insensitive) ── */
  function findKey(encField, rowKeys){
    if(!encField) return null;
    var name=encField.name;
    /* exact */
    if(rowKeys.indexOf(name)>=0) return name;
    /* case-insensitive */
    var nl=name.toLowerCase();
    for(var i=0;i<rowKeys.length;i++){
      if(rowKeys[i].toLowerCase()===nl) return rowKeys[i];
    }
    return null;
  }

  /* ── Find date key by scanning all row keys ── */
  function findDateKey(rowKeys, rows){
    /* prefer keys containing 'day','date','month','posting' */
    var scored=[];
    rowKeys.forEach(function(k){
      var kl=k.toLowerCase();
      var score=0;
      if(kl.indexOf('day')>=0)     score=10;
      else if(kl.indexOf('date')>=0)  score=9;
      else if(kl.indexOf('posting')>=0) score=8;
      else if(kl.indexOf('month')>=0) score=6;
      else if(kl.indexOf('year')>=0)  score=2;
      else if(kl.indexOf('quarter')>=0) score=1;
      if(score>0) scored.push({k:k,s:score});
    });
    if(!scored.length) return null;
    scored.sort(function(a,b){return b.s-a.s;});

    /* among top candidates, pick the one whose nativeValue looks like a full date (epoch ms) */
    for(var i=0;i<scored.length;i++){
      var k=scored[i].k;
      if(!rows.length||!rows[0][k]) continue;
      var nv=rows[0][k].nativeValue;
      /* epoch ms date: large number, gives a valid date in 1990-2050 range */
      if(typeof nv==='number'&&nv>1e10){
        var d=new Date(nv);
        if(d.getFullYear()>=1990&&d.getFullYear()<=2050) return k;
      }
      /* formattedValue looks like a real date */
      var fv=rows[0][k].formattedValue||'';
      if(fv.match(/\d{4}[-\/]\d{2}[-\/]\d{2}/)||fv.match(/\w+ \d{1,2},? \d{4}/)||fv.match(/\d{1,2}[-\/]\w+[-\/]\d{4}/)){
        return k;
      }
    }
    /* fallback: just use highest scored */
    return scored[0].k;
  }

  /* ── Parse a DataValue into a JS Date ── */
  function parseDate(dv){
    if(!dv) return null;
    var nv=dv.nativeValue!==undefined?dv.nativeValue:dv.value;
    var fv=dv.formattedValue||String(dv.value||'');

    /* epoch ms */
    if(typeof nv==='number'&&nv>1e10){
      var d=new Date(nv);
      if(d.getFullYear()>=1990&&d.getFullYear()<=2050) return d;
    }
    /* integer year */
    if(typeof nv==='number'&&nv>=1990&&nv<=2050) return new Date(nv,0,1);
    /* integer month 1-12 */
    if(typeof nv==='number'&&nv>=1&&nv<=12) return new Date(2000,nv-1,1);

    /* string date formats */
    if(fv){
      /* ISO */
      var iso=fv.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(iso) return new Date(+iso[1],+iso[2]-1,+iso[3]);
      /* DD/MM/YYYY */
      var dmy=fv.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if(dmy) return new Date(+dmy[3],+dmy[2]-1,+dmy[1]);
      /* May 15, 2025 or 15 May 2025 */
      var MN=['january','february','march','april','may','june','july','august','september','october','november','december'];
      var MS2=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
      var parts=fv.split(/[\s,]+/);
      if(parts.length>=3){
        var mi=-1,yr=-1,dy=-1;
        parts.forEach(function(p){
          var pl=p.toLowerCase();
          var m=MN.indexOf(pl); if(m<0) m=MS2.indexOf(pl.slice(0,3));
          if(m>=0) mi=m;
          else if(+p>=1900&&+p<=2100) yr=+p;
          else if(+p>=1&&+p<=31) dy=+p;
        });
        if(mi>=0&&yr>=0) return new Date(yr,mi,Math.max(1,dy));
      }
      /* try native parse as last resort */
      var d2=new Date(fv);
      if(!isNaN(d2.getTime())&&d2.getFullYear()>=1990) return d2;
    }
    return null;
  }

  /* ── Process rows into time-sorted points ── */
  function process(rows,enc){
    if(!rows.length) return [];

    var rowKeys=Object.keys(rows[0]);
    console.log('rowKeys:',rowKeys);
    console.log('enc:',Object.keys(enc).map(function(k){return k+':'+(enc[k]?enc[k].name:'null');}));

    /* find date key */
    var dateKey=findDateKey(rowKeys,rows);
    /* find measure keys from encodings */
    var endKey =findKey(enc.ending,   rowKeys);
    var begKey =findKey(enc.beginning,rowKeys);
    var ordKey =findKey(enc.ordered,  rowKeys);
    var limKey =findKey(enc.limit,    rowKeys);

    console.log('dateKey:',dateKey,'endKey:',endKey,'begKey:',begKey,'ordKey:',ordKey,'limKey:',limKey);

    if(!endKey) return [];

    var pts=[];
    rows.forEach(function(row){
      var endDv =endKey  ? row[endKey]  : null;
      var begDv =begKey  ? row[begKey]  : null;
      var ordDv =ordKey  ? row[ordKey]  : null;
      var limDv =limKey  ? row[limKey]  : null;
      var dateDv=dateKey ? row[dateKey] : null;

      var ending=dvNum(endDv);
      if(ending===null) return;

      var dateObj=parseDate(dateDv);
      if(!dateObj) return;

      var fv=dateDv?(dateDv.formattedValue||''):'';
      var label=fv||fmtDate(dateObj);

      pts.push({
        date:dateObj,
        num:dateObj.getTime(),
        label:label,
        ending:ending,
        beginning:dvNum(begDv),
        ordered:dvNum(ordDv),
        limit:dvNum(limDv)
      });
    });

    /* sort chronologically, deduplicate */
    pts.sort(function(a,b){return a.num-b.num;});
    var seen={};
    var unique=[];
    pts.forEach(function(p){
      if(!seen[p.num]){seen[p.num]=true;unique.push(p);}
    });
    return unique;
  }

  /* ── Slice by days ── */
  function slice(w){
    if(w===0) return ALL;
    var cutoff=new Date();
    cutoff.setDate(cutoff.getDate()-w);
    return ALL.filter(function(p){return p.date>=cutoff;});
  }

  /* ── Update KPIs ── */
  function setKpi(id,cls,v,dTxt,dCls){
    $(id).textContent=v;
    if(dTxt!==undefined){
      var dl=$(id.replace('k-','k-')+'').nextElementSibling;
      /* find the kpi-d span */
    }
    /* set via explicit element id */
  }

  function updateKPIs(d){
    if(!d.length) return;
    var last=d[d.length-1], first=d[0];

    /* ending */
    $('k-end').textContent=fN(last.ending);
    $('k-end-d').textContent=fmtDate(last.date);

    /* beginning */
    var beg=first.beginning!==null?first.beginning:first.ending;
    $('k-beg').textContent=fN(beg);
    $('k-beg-d').textContent=fmtDate(first.date);

    /* ordered — sum */
    var totOrd=d.reduce(function(s,p){return s+(p.ordered||0);},0);
    $('k-ord').textContent=(totOrd>=0?'+':'')+fN(totOrd);
    $('k-ord-d').className='kpi-d '+(totOrd>=0?'g':'r');
    $('k-ord-d').textContent=totOrd>=0?'Net inflow':'Net outflow';
    document.getElementById('kpi2').className='kpi '+(totOrd>=0?'c-g':'c-r');

    /* limit */
    var limV=last.limit;
    $('k-lim').textContent=fN(limV);
    $('k-lim-d').textContent=limV?'Cap':'—';

    /* utilisation */
    if(last.ending&&limV&&limV!==0){
      var util=(last.ending/limV)*100;
      var uc=util>=100?'r':util>=85?'a':'g';
      $('k-util').textContent=util.toFixed(1)+'%';
      $('k-util-d').className='kpi-d '+uc;
      $('k-util-d').textContent=util>=100?'⚠ Over limit':util>=85?'Near limit':'Within limit';
      document.getElementById('kpi4').className='kpi c-'+uc;
    } else {
      $('k-util').textContent='—';
      $('k-util-d').textContent='—';
    }
  }

  /* ── Update Insights ── */
  function updateInsights(d){
    if(!d.length) return;
    var endings=d.map(function(p){return p.ending;}).filter(function(v){return v!==null;});
    if(!endings.length) return;

    var maxV=Math.max.apply(null,endings);
    var minV=Math.min.apply(null,endings);
    var maxPt=d.find(function(p){return p.ending===maxV;});
    var minPt=d.find(function(p){return p.ending===minV;});
    var avg=endings.reduce(function(s,v){return s+v;},0)/endings.length;

    $('i-max-v').textContent=fN(maxV);
    $('i-max-d').textContent=maxPt?fmtDate(maxPt.date):'—';

    $('i-min-v').textContent=fN(minV);
    $('i-min-d').textContent=minPt?fmtDate(minPt.date):'—';

    var breaches=d.filter(function(p){return p.ending!==null&&p.limit!==null&&p.ending>p.limit;});
    $('i-breach-v').textContent=breaches.length+' days';
    $('i-breach-d').textContent=breaches.length===0?'Always within limit':'⚠ Limit exceeded';
    $('i-breach-d').style.color=breaches.length>0?'var(--rd)':'var(--gd)';

    $('i-avg-v').textContent=fN(avg);
    $('i-avg-d').textContent='Over '+d.length+' days';
  }

  /* ── Draw Chart ── */
  function drawChart(d){
    var labels  =d.map(function(p){return p.label;});
    var endings =d.map(function(p){return p.ending;});
    var begins  =d.map(function(p){return p.beginning;});
    var ordered =d.map(function(p){return p.ordered;});
    var limits  =d.map(function(p){return p.limit;});

    $('ax-l').textContent=labels[0]||'';
    $('ax-r').textContent=labels[labels.length-1]||'';

    /* y range */
    var allY=endings.concat(begins,limits).filter(function(v){return v!==null;});
    var yMin=Math.max(0,Math.floor(Math.min.apply(null,allY)*0.95));
    var yMax=Math.ceil(Math.max.apply(null,allY)*1.05);

    var ordVals=ordered.filter(function(v){return v!==null;});
    var ordMax=ordVals.length?Math.max.apply(null,ordVals.map(Math.abs))*1.5:1;

    var fs=parseInt(appEl.style.fontSize)||13;
    var tickFs=Math.max(7,Math.round(fs*0.65));
    var ttFs=Math.max(9,Math.round(fs*0.84));

    /* auto-skip labels based on data density */
    var maxTicks=Math.max(6,Math.floor((appEl.offsetWidth||960)/60));

    if(!chartObj){
      var ctx=$('chart').getContext('2d');
      chartObj=new Chart(ctx,{
        data:{labels:labels,datasets:[
          {
            type:'line',label:'Ending Balance',data:endings,
            borderColor:'#16a34a',borderWidth:2,
            pointRadius:d.length>60?0:2.5,
            pointBackgroundColor:'#16a34a',pointBorderColor:'#fff',pointBorderWidth:1.5,
            pointHoverRadius:4,tension:.3,fill:false,yAxisID:'y',order:1
          },
          {
            type:'line',label:'Beginning Balance',data:begins,
            borderColor:'#3b82f6',borderWidth:1.5,borderDash:[4,3],
            pointRadius:0,tension:.3,fill:false,yAxisID:'y',order:2
          },
          {
            type:'bar',label:'Ordered Cash',data:ordered,
            backgroundColor:ordered.map(function(v){return v>=0?'rgba(245,158,11,0.18)':'rgba(220,38,38,0.18)';}),
            borderColor:ordered.map(function(v){return v>=0?'#f59e0b':'#dc2626';}),
            borderWidth:1,borderRadius:2,borderSkipped:false,
            yAxisID:'y2',order:3
          },
          {
            type:'line',label:'Limit',data:limits,
            borderColor:'#cbd5e1',borderWidth:1.5,borderDash:[6,4],
            pointRadius:0,fill:false,yAxisID:'y',order:4
          }
        ]},
        options:{
          responsive:true,maintainAspectRatio:false,
          interaction:{mode:'index',intersect:false},
          plugins:{
            legend:{display:false},
            tooltip:{
              backgroundColor:'rgba(10,10,10,.9)',
              titleColor:'#fff',bodyColor:'rgba(255,255,255,.72)',
              titleFont:{size:ttFs,weight:'600',family:'Inter'},
              bodyFont:{size:Math.max(8,Math.round(fs*.76)),family:'Inter'},
              padding:10,cornerRadius:8,
              callbacks:{
                label:function(ctx2){
                  if(ctx2.raw===null) return null;
                  return ' '+ctx2.dataset.label+': '+fN(ctx2.raw);
                }
              }
            }
          },
          scales:{
            x:{
              grid:{display:false},border:{display:false},
              ticks:{font:{size:tickFs},color:'#cbd5e1',maxRotation:45,autoSkip:true,maxTicksLimit:maxTicks}
            },
            y:{
              min:yMin,max:yMax,
              grid:{color:'rgba(0,0,0,.04)'},border:{display:false},
              ticks:{font:{size:tickFs},color:'#94a3b8',callback:function(v){return fN(v);}}
            },
            y2:{display:false,min:-ordMax,max:ordMax,position:'right'}
          }
        }
      });
    } else {
      chartObj.data.labels=labels;
      chartObj.data.datasets[0].data=endings;
      chartObj.data.datasets[0].pointRadius=d.length>60?0:2.5;
      chartObj.data.datasets[1].data=begins;
      chartObj.data.datasets[2].data=ordered;
      chartObj.data.datasets[2].backgroundColor=ordered.map(function(v){return v>=0?'rgba(245,158,11,0.18)':'rgba(220,38,38,0.18)';});
      chartObj.data.datasets[2].borderColor=ordered.map(function(v){return v>=0?'#f59e0b':'#dc2626';});
      chartObj.data.datasets[3].data=limits;
      chartObj.options.scales.y.min=yMin;
      chartObj.options.scales.y.max=yMax;
      chartObj.options.scales.y2.min=-ordMax;
      chartObj.options.scales.y2.max=ordMax;
      chartObj.options.scales.x.ticks.maxTicksLimit=maxTicks;
      chartObj.update('active');
    }
  }

  /* ── Render view ── */
  function renderView(w){
    activeW=w;
    var d=slice(w);
    if(!d.length) return;
    updateKPIs(d);
    updateInsights(d);
    drawChart(d);
  }

  /* ── Wire toggles ── */
  function wireToggles(){
    document.querySelectorAll('.tgl').forEach(function(btn){
      btn.addEventListener('click',function(){
        document.querySelectorAll('.tgl').forEach(function(b){b.classList.remove('on');});
        btn.classList.add('on');
        renderView(parseInt(btn.dataset.w,10));
      });
    });
  }

  /* ── Smart default toggle ── */
  function pickDefault(n){
    var best='0';
    if(n<=90) best='90'; else if(n<=180) best='180'; else if(n<=365) best='365';
    document.querySelectorAll('.tgl').forEach(function(b){
      b.classList.remove('on');
      if(b.dataset.w===best) b.classList.add('on');
    });
    return parseInt(best,10);
  }

  /* ── CONFIRMED WORKING init pattern ── */
  window.onload=tableau.extensions.initializeAsync().then(function(){
    var ws=tableau.extensions.worksheetContent.worksheet;
    wireToggles();
    applyScale(appEl.offsetWidth||960);

    var update=async function(){
      var data=await getData(ws);
      var enc =await getEnc(ws);
      var pts =process(data,enc);
      if(!pts.length){ console.warn('No points processed'); return; }
      ALL=pts;
      var defW=pickDefault(pts.length);
      renderView(defW);
    };

    ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,update);
    update();
  });

})();
</script>
</body>
</html>
