<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Cash Analytics Debug</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
  body{font-family:monospace;font-size:11px;background:#f4f6f9;padding:12px;margin:0}
  .ok{background:#dcfce7;color:#15803d;padding:6px 10px;border-radius:6px;margin-bottom:8px;font-weight:600}
  .err{background:#fee2e2;color:#b91c1c;padding:6px 10px;border-radius:6px;margin-bottom:8px;font-weight:600}
  h4{font-size:10px;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 4px}
  pre{background:#fff;border:0.5px solid #e2e8f0;border-radius:6px;padding:8px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow-y:auto;font-size:10px}
</style>
</head>
<body>
<div id="status">Initialising…</div>
<h4>Encoding map</h4><pre id="enc-out">waiting…</pre>
<h4>Total rows returned</h4><pre id="row-count">waiting…</pre>
<h4>Row[0] — all fields</h4><pre id="row0">waiting…</pre>
<h4>Row[1] — all fields</h4><pre id="row1">waiting…</pre>
<h4>Date field parse test</h4><pre id="date-test">waiting…</pre>

<script>
'use strict';
(function(){
  async function getData(ws){
    var rows=[],rdr=await ws.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
    for(var i=0;i<rdr.pageCount;i++){
      var pg=await rdr.getPageAsync(i);
      pg.data.forEach(function(r){
        var row={};
        pg.columns.forEach(function(c,idx){row[c.fieldName]=r[idx];});
        rows.push(row);
      });
    }
    await rdr.releaseAsync();
    return rows;
  }
  async function getEnc(ws){
    var spec=await ws.getVisualSpecificationAsync(),map={};
    if(spec.activeMarksSpecificationIndex<0) return map;
    spec.marksSpecifications[spec.activeMarksSpecificationIndex]
        .encodings.forEach(function(e){map[e.id]=e.field;});
    return map;
  }
  window.onload=tableau.extensions.initializeAsync().then(function(){
    var ws=tableau.extensions.worksheetContent.worksheet;
    var update=async function(){
      try{
        document.getElementById('status').className='ok';
        document.getElementById('status').textContent='✓ Init OK — '+ws.name;
        var data=await getData(ws);
        var enc=await getEnc(ws);
        /* enc */
        var em={};
        Object.keys(enc).forEach(function(k){em[k]=enc[k]?{name:enc[k].name,role:enc[k].role,dataType:enc[k].dataType}:null;});
        document.getElementById('enc-out').textContent=JSON.stringify(em,null,2);
        /* row count */
        document.getElementById('row-count').textContent='rows: '+data.length;
        /* row 0 */
        function dumpRow(r){
          var d={};
          Object.keys(r).forEach(function(k){
            var dv=r[k];
            d[k]={value:dv?dv.value:null,nativeValue:dv?dv.nativeValue:null,formattedValue:dv?dv.formattedValue:null};
          });
          return JSON.stringify(d,null,2);
        }
        document.getElementById('row0').textContent=data.length>0?dumpRow(data[0]):'NO DATA';
        document.getElementById('row1').textContent=data.length>1?dumpRow(data[1]):'ONLY 1 ROW';
        /* date parse test */
        if(data.length>0&&enc.date){
          var dv=data[0][enc.date.name];
          var info='fieldName: '+enc.date.name+'\n';
          if(dv){
            info+='value: '+JSON.stringify(dv.value)+'\n';
            info+='nativeValue: '+JSON.stringify(dv.nativeValue)+'\n';
            info+='formattedValue: '+JSON.stringify(dv.formattedValue)+'\n';
            if(typeof dv.nativeValue==='number'){
              var d=new Date(dv.nativeValue);
              info+='parsed as ms epoch: '+d.toISOString()+'\n';
            }
          } else {
            info+='DataValue is NULL for date field in row[0]';
          }
          document.getElementById('date-test').textContent=info;
        } else {
          document.getElementById('date-test').textContent='enc.date not mapped or no data';
        }
      }catch(e){
        document.getElementById('status').className='err';
        document.getElementById('status').textContent='ERROR: '+String(e);
        console.error(e);
      }
    };
    ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,update);
    update();
  },function(e){
    document.getElementById('status').className='err';
    document.getElementById('status').textContent='INIT FAILED: '+String(e);
  });
})();
</script>
</body>
</html>
